<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Getter Card · Carteira de Membros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold-light:#EFD8A5;
    --gold-mid:#CBA164;
    --bronze:#8C6136;
    --bronze-deep:#5E4023;
    --ink:#2A1D10;
    --ink-soft:#5B4630;
    --pill:#D9BD8C;
    --pill-line:#C4A473;
    --cream:#F7EFDD;
    --cream-card:#FFFCF4;
    --ember:#B6472C;
    --line:rgba(42,29,16,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- HEADER: réplica do Getter Card físico ---------- */
  .card-banner{
    position:relative;
    margin:16px 14px 0;
    border-radius:20px;
    overflow:hidden;
    background:
      linear-gradient(135deg, var(--gold-light) 0%, var(--gold-mid) 45%, var(--bronze) 100%);
    box-shadow:0 10px 24px rgba(94,64,35,0.25);
    border:1px solid rgba(255,255,255,0.35);
  }
  .card-banner::before,
  .card-banner::after{
    content:"";
    position:absolute;
    left:0; right:0;
    height:5px;
    background:linear-gradient(90deg, var(--ember), #7A2E1C 40%, var(--ember) 100%);
    opacity:0.85;
  }
  .card-banner::before{ top:0; }
  .card-banner::after{ bottom:0; }
  .banner-inner{
    display:flex;
    align-items:center;
    gap:14px;
    padding:20px 18px;
  }
  .logo-wrap{
    flex:0 0 auto;
    width:78px; height:78px;
    border-radius:14px;
    background:var(--cream-card);
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(42,29,16,0.08);
    overflow:hidden;
  }
  .logo-wrap img{
    width:88%; height:88%;
    object-fit:contain;
    object-position:top center;
  }
  .banner-text{ flex:1; min-width:0; }
  .banner-eyebrow{
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--bronze-deep);
    font-weight:700;
    margin:0 0 2px;
  }
  .banner-title{
    font-size:22px;
    font-weight:900;
    letter-spacing:.01em;
    color:var(--ink);
    margin:0;
    line-height:1.08;
  }
  .banner-sub{
    font-size:13.5px;
    font-weight:700;
    font-style:italic;
    color:var(--ember);
    margin:3px 0 0;
  }

  /* ---------- CONTROLS ---------- */
  .controls{
    position:sticky; top:0; z-index:10;
    background:var(--cream);
    padding:16px 14px 10px;
    border-bottom:1px solid var(--line);
  }
  .search{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--pill-line);
    background:var(--cream-card);
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  .search:focus{outline:2px solid var(--ember); outline-offset:1px;}
  .chips{
    display:flex; gap:8px;
    overflow-x:auto;
    margin-top:10px;
    padding-bottom:4px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:7px 13px;
    border-radius:20px;
    border:1px solid var(--pill-line);
    background:var(--cream-card);
    color:var(--bronze-deep);
    white-space:nowrap;
    cursor:pointer;
  }
  .chip.active{
    background:var(--bronze-deep);
    color:var(--gold-light);
    border-color:var(--bronze-deep);
  }
  .count{
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    margin:10px 14px 0;
  }

  /* ---------- LIST / CARDS ---------- */
  .list{
    padding:14px 14px 40px;
    display:flex; flex-direction:column;
    gap:12px;
  }
  .card{
    background:var(--cream-card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    transition:box-shadow .2s ease;
  }
  .card.open{box-shadow:0 8px 22px rgba(94,64,35,0.14);}
  .card-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 16px;
    cursor:pointer;
  }
  .badge{
    flex:0 0 auto;
    width:40px; height:40px;
    border-radius:11px;
    background:linear-gradient(135deg, var(--gold-light), var(--bronze));
    color:var(--ink);
    font-family:'Poppins',sans-serif;
    font-size:13.5px;
    font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .head-text{flex:1; min-width:0;}
  .name{
    font-size:16px;
    font-weight:700;
    margin:0;
    color:var(--ink);
  }
  .ramo{
    font-family:'Inter',sans-serif;
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:2px;
    font-weight:600;
  }
  .chevron{
    flex:0 0 auto;
    font-size:18px;
    color:var(--ember);
    transition:transform .25s ease;
  }
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
  }
  .card-body-inner{
    padding:2px 16px 18px 68px;
    font-family:'Inter',sans-serif;
  }
  .beneficio-pill{
    background:var(--pill);
    border:1px solid var(--pill-line);
    border-radius:10px;
    padding:12px 14px;
    margin:0 0 14px;
  }
  .beneficio{
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink);
    white-space:pre-line;
    margin:0;
    font-weight:500;
  }
  .wa-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .wa-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--bronze-deep);
    color:var(--gold-light);
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    padding:9px 15px;
    border-radius:8px;
  }
  .empty{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  footer{
    text-align:center;
    padding:22px 20px;
    font-family:'Inter',sans-serif;
    font-size:11px;
    color:var(--ink-soft);
  }
</style>
</head>

const listEl = document.getElementById('list');
const chipsEl = document.getElementById('chips');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');

const ramos = ["Todos", ...Array.from(new Set(parceiros.map(p=>p.ramo))).sort()];
let activeRamo = "Todos";
let query = "";

function initials(nome){
  return nome.split(/[\s(]/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function waLink(raw){
  const digits = raw.split('|')[0].replace(/\D/g,'');
  if(!digits) return null;
  const full = digits.startsWith('55') ? digits : '55'+digits;
  return `https://wa.me/${full}`;
}

function contatoLabel(raw){
  const parts = raw.split('|');
  return parts[1] ? `WhatsApp · ${parts[1]}` : 'Falar no WhatsApp';
}

function render(){
  const q = query.trim().toLowerCase();
  const filtered = parceiros.filter(p=>{
    const matchesRamo = activeRamo === "Todos" || p.ramo === activeRamo;
    const matchesQuery = !q || p.nome.toLowerCase().includes(q) || p.ramo.toLowerCase().includes(q);
    return matchesRamo && matchesQuery;
  });

  countEl.textContent = `${filtered.length} parceiro${filtered.length===1?'':'s'}`;

  listEl.innerHTML = '';
  if(filtered.length === 0){
    listEl.innerHTML = '<div class="empty">Nenhum parceiro encontrado.</div>';
    return;
  }

  filtered.forEach((p)=>{
    const card = document.createElement('div');
    card.className = 'card';
    const btns = p.contatos.map(c=>{
      const link = waLink(c);
      if(!link) return '';
      return `<a class="wa-btn" href="${link}" target="_blank" rel="noopener">${contatoLabel(c)}</a>`;
    }).join('');
    card.innerHTML = `
      <div class="card-head">
        <div class="badge">${initials(p.nome)}</div>
        <div class="head-text">
          <p class="name">${p.nome}</p>
          <p class="ramo">${p.ramo}</p>
        </div>
        <div class="chevron">⌄</div>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          <div class="beneficio-pill"><p class="beneficio">${p.beneficio}</p></div>
          <div class="wa-row">${btns}</div>
        </div>
      </div>
    `;
    const head = card.querySelector('.card-head');
    const body = card.querySelector('.card-body');
    head.addEventListener('click', ()=>{
      const isOpen = card.classList.contains('open');
      document.querySelectorAll('.card.open').forEach(c=>{
        if(c!==card){ c.classList.remove('open'); c.querySelector('.card-body').style.maxHeight = null; }
      });
      if(isOpen){
        card.classList.remove('open');
        body.style.maxHeight = null;
      } else {
        card.classList.add('open');
        body.style.maxHeight = body.scrollHeight + 'px';
      }
    });
    listEl.appendChild(card);
  });
}

ramos.forEach(r=>{
  const chip = document.createElement('div');
  chip.className = 'chip' + (r === activeRamo ? ' active' : '');
  chip.textContent = r;
  chip.addEventListener('click', ()=>{
    activeRamo = r;
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    render();
  });
  chipsEl.appendChild(chip);
});

searchEl.addEventListener('input', (e)=>{
  query = e.target.value;
  render();
});

render();
</script>
